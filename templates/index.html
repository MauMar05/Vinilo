<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinilo</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

  <!-- Columna izquierda: búsqueda y resultados -->
  <aside class="panel-buscar">
    <div class="marca">
      <svg class="logo-vinilo" width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="16" fill="#0B0C10" stroke="#2A2E38" stroke-width="1"/>
        <circle cx="17" cy="17" r="12.5" fill="none" stroke="#22252E" stroke-width="1"/>
        <circle cx="17" cy="17" r="9.5" fill="none" stroke="#22252E" stroke-width="1"/>
        <circle cx="17" cy="17" r="6.5" fill="none" stroke="#22252E" stroke-width="1"/>
        <circle cx="17" cy="17" r="4" fill="#D9A441"/>
        <circle cx="17" cy="17" r="1.2" fill="#0B0C10"/>
      </svg>
      <span>Vinilo</span>
    </div>

    <div class="barra-cuenta">
      {% if current_user.is_authenticated %}
        <span>Hola, {{ current_user.nombre_usuario }}</span>
        <a href="{{ url_for('logout') }}">Cerrar sesión</a>
      {% else %}
        <span>Tus favoritos e historial no se están guardando</span>
        <span>
          <a href="{{ url_for('login') }}">Iniciar sesión</a>
          <span class="separador">·</span>
          <a href="{{ url_for('registro') }}">Crear cuenta</a>
        </span>
      {% endif %}
    </div>

    <form id="form-buscar" class="caja-buscar">
      <input
        type="text"
        id="input-buscar"
        placeholder="Buscar canción o artista"
        autocomplete="off"
      >
      <button type="submit" aria-label="Buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </form>

    <div id="estado-busqueda" class="estado-busqueda"></div>

    <div id="chips-recientes" class="chips-recientes"></div>

    <div class="pestanas">
      <button type="button" class="pestana activa" data-pestana="resultados">Resultados</button>
      <button type="button" class="pestana" data-pestana="favoritos">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px; margin-right:3px;">
          <path d="M12 21s-6.7-4.35-9.3-8.1C1.1 10.5 1.6 7.3 4 5.6 6 4.2 8.6 4.6 10 6.3l2 2.4 2-2.4c1.4-1.7 4-2.1 6-.7 2.4 1.7 2.9 4.9 1.3 7.3C18.7 16.65 12 21 12 21z"/>
        </svg>
        Favoritos
      </button>
      <button type="button" class="pestana" data-pestana="historial">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px; margin-right:3px;">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3 3"></path>
        </svg>
        Historial
      </button>
    </div>

    <ul id="lista-resultados" class="lista-resultados"></ul>
  </aside>

  <!-- Panel principal: reproductor -->
  <main class="panel-reproductor">

    <div id="vacio" class="estado-vacio">
      <p>Busca algo para empezar a escuchar.</p>
    </div>

    <div id="reproductor" class="reproductor oculto">
      <div class="carratula-envoltorio">
        <img id="carratula" class="carratula" src="" alt="">
        <button id="btn-favorito" class="btn-favorito" aria-label="Agregar a favoritos">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21s-6.7-4.35-9.3-8.1C1.1 10.5 1.6 7.3 4 5.6 6 4.2 8.6 4.6 10 6.3l2 2.4 2-2.4c1.4-1.7 4-2.1 6-.7 2.4 1.7 2.9 4.9 1.3 7.3C18.7 16.65 12 21 12 21z"/>
          </svg>
        </button>
      </div>

      <div class="info-cancion">
        <h1 id="titulo-cancion">—</h1>
        <p id="canal-cancion">—</p>
      </div>

      <div class="controles">
        <button id="btn-anterior" class="btn-secundario" aria-label="Anterior">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path>
          </svg>
        </button>

        <button id="btn-play" class="btn-play" aria-label="Reproducir / Pausar">
          <svg id="icono-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"></path>
          </svg>
          <svg id="icono-pausa" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <rect x="6" y="5" width="4" height="14"></rect>
            <rect x="14" y="5" width="4" height="14"></rect>
          </svg>
        </button>

        <button id="btn-siguiente" class="btn-secundario" aria-label="Siguiente">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M16 6h2v12h-2zM6 6v12l8.5-6z"></path>
          </svg>
        </button>

        <span id="tiempo-actual" class="tiempo">0:00</span>

        <input type="range" id="barra-progreso" class="barra-progreso" value="0" min="0" max="100" step="0.1">

        <span id="tiempo-total" class="tiempo">0:00</span>

        <div class="volumen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 10v4h4l5 5V5L7 10H3z"></path>
          </svg>
          <input type="range" id="barra-volumen" class="barra-volumen" min="0" max="100" value="70">
        </div>
      </div>
    </div>

    <!-- El reproductor real de YouTube vive oculto; solo aporta el audio -->
    <div id="yt-player" class="yt-oculto"></div>

  </main>

</div>

<script>
  window.USUARIO_AUTENTICADO = {{ 'true' if current_user.is_authenticated else 'false' }};
</script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
