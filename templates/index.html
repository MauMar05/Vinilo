<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

  <!-- Columna izquierda: búsqueda y resultados -->
  <aside class="panel-buscar">
    <div class="marca">Vinilo</div>

    <form id="form-buscar" class="caja-buscar">
      <input
        type="text"
        id="input-buscar"
        placeholder="Buscar canción o artista"
        autocomplete="off"
      >
      <button type="submit" aria-label="Buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </form>

    <div id="estado-busqueda" class="estado-busqueda"></div>

    <ul id="lista-resultados" class="lista-resultados"></ul>
  </aside>

  <!-- Panel principal: reproductor -->
  <main class="panel-reproductor">

    <div id="vacio" class="estado-vacio">
      <p>Busca algo para empezar a escuchar.</p>
    </div>

    <div id="reproductor" class="reproductor oculto">
      <div class="carratula-envoltorio">
        <img id="carratula" class="carratula" src="" alt="">
      </div>

      <div class="info-cancion">
        <h1 id="titulo-cancion">—</h1>
        <p id="canal-cancion">—</p>
      </div>

      <div class="controles">
        <button id="btn-play" class="btn-play" aria-label="Reproducir / Pausar">
          <svg id="icono-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"></path>
          </svg>
          <svg id="icono-pausa" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <rect x="6" y="5" width="4" height="14"></rect>
            <rect x="14" y="5" width="4" height="14"></rect>
          </svg>
        </button>

        <span id="tiempo-actual" class="tiempo">0:00</span>

        <input type="range" id="barra-progreso" class="barra-progreso" value="0" min="0" max="100" step="0.1">

        <span id="tiempo-total" class="tiempo">0:00</span>

        <div class="volumen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 10v4h4l5 5V5L7 10H3z"></path>
          </svg>
          <input type="range" id="barra-volumen" class="barra-volumen" min="0" max="100" value="70">
        </div>
      </div>
    </div>

    <!-- El reproductor real de YouTube vive oculto; solo aporta el audio -->
    <div id="yt-player" class="yt-oculto"></div>

  </main>

</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
