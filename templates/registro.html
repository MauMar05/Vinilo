<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — Vinilo</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="pantalla-auth">
  <div class="tarjeta-auth">
    <div class="marca marca-auth">
      <svg class="logo-vinilo" width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="16" fill="#0B0C10" stroke="#2A2E38" stroke-width="1"/>
        <circle cx="17" cy="17" r="12.5" fill="none" stroke="#22252E" stroke-width="1"/>
        <circle cx="17" cy="17" r="9.5" fill="none" stroke="#22252E" stroke-width="1"/>
        <circle cx="17" cy="17" r="6.5" fill="none" stroke="#22252E" stroke-width="1"/>
        <circle cx="17" cy="17" r="4" fill="#D9A441"/>
        <circle cx="17" cy="17" r="1.2" fill="#0B0C10"/>
      </svg>
      <span>Vinilo</span>
    </div>

    <h1 class="titulo-auth">Crea tu cuenta</h1>
    <p class="subtitulo-auth">Tus favoritos, historial y búsquedas te van a esperar en cualquier dispositivo.</p>

    {% if error %}
      <div class="mensaje-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="form-auth" novalidate>
      <label for="nombre_usuario">Nombre de usuario</label>
      <input type="text" id="nombre_usuario" name="nombre_usuario" value="{{ nombre_usuario or '' }}" minlength="3" required autofocus>

      <label for="email">Correo</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" minlength="6" required>
      <span class="ayuda-campo">Mínimo 6 caracteres.</span>

      <button type="submit" class="btn-auth">Crear cuenta</button>
    </form>

    <p class="pie-auth">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
    <p class="pie-auth"><a href="{{ url_for('home') }}">← Volver sin iniciar sesión</a></p>
  </div>
</div>

</body>
</html>
